<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartographe</title>
<link rel="stylesheet" href="css/commun.css">
<link rel="icon" href="icone-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#221b11">
<!-- Capté AU PLUS TÔT : le navigateur émet « beforeinstallprompt » dès qu'il a lu le
     manifeste, souvent avant que le script de la page soit exécuté. L'événement ne se
     rejoue pas — le manquer, c'est perdre la possibilité d'installer sur un clic. -->
<script>window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();               // on garde la main : l'invite partira sur CLIC
  window.__kjInvite = e;
  var b = document.getElementById('b-installer');
  if (b) b.hidden = false;
});</script>
</head>
<!-- page-biblio : la bibliothèque n'a pas de carte à ménager, ses cibles tactiles
     peuvent être pleine taille (voir commun.css, section mobile) -->
<body class="page-biblio">

<header>
  <a class="marque" href="index.html" title="Revenir à la bibliothèque de cartes">Cartographie</a>
  <select id="filtre-campagne" title="Afficher une seule campagne"></select>
  <div class="esp"></div>
  <a class="btn" id="lien-table" href="table.html" title="Ouvrir la table de jeu">▶ Table de jeu</a>
  <button id="b-rejoindre" title="Rejoindre la partie ouverte par le MJ">📡 Rejoindre</button>
  <button id="b-mj" title="Compte MJ : cartes et parties privées">🛡 Espace MJ</button>
  <!-- caché par défaut : révélé seulement si le navigateur sait vraiment installer
       (voir « installation » dans le script) — un bouton qui ne fait rien est pire
       que pas de bouton -->
  <button id="b-installer" title="Installer Cartographie sur cet appareil" hidden>⤓ Installer l’appli</button>
  <span id="grp-edition" hidden>
    <button id="b-campagne" title="Créer un dossier de campagne">🗀 Nouvelle campagne</button>
    <a class="btn" id="b-nouveau" href="editeur.html?id=nouveau">＋ Nouvelle carte</a>
    <button id="b-importer">↑ Importer un .json</button>
  </span>
  <input type="file" id="fichier" accept=".json,application/json" multiple hidden>
</header>

<div id="alerte-fichier"></div>
<div id="modale" hidden>
  <div class="boite">
    <h3 id="modale-titre"></h3>
    <div id="modale-corps"></div>
    <div class="actions-modale">
      <button id="modale-annuler">Annuler</button>
      <button id="modale-ok" class="primaire">Enregistrer</button>
    </div>
  </div>
</div>
<div id="app">
  <div id="biblio">
    <p class="aide" id="note-lecture" style="grid-column:1/-1;padding:0 18px;margin:8px 0 0" hidden></p>
    <div id="liste" style="display:contents"></div>
  </div>
</div>

<script src="js/dialogue.js"></script>
<script src="js/modele.js"></script>
<script src="js/rendu.js"></script>
<script src="js/stockage.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/session.js"></script>
<script>
(function () {
  const M = KJ.modele, R = KJ.rendu, S = KJ.stockage;
  const $ = (id) => document.getElementById(id);

  /* Fonds de carte du compte, résolus à la demande : le fond est stocké comme une
     référence « img:<id> » et non comme une image, sinon chaque carte pèserait des
     Mo. Sans cette table, la miniature s'affichait sans son fond — la carte semblait
     vide alors qu'elle ne l'est pas. */
  const fonds = {};
  const refFond = (carte) => (carte.fond && /^img:/.test(carte.fond.src || '') ? carte.fond.src : '');

  function apercu(carte) {
    // miniature : rendu sans grain (plus léger) et sans les secrets
    return R.svgString(carte, { grain: false, vueMJ: false, grille: true,
        resoudreSrc: (s) => fonds[s] || '' })
      .replace('<svg ', '<svg preserveAspectRatio="xMidYMid meet" ');
  }

  /* Après coup : on télécharge les seuls fonds réellement utilisés, puis on redessine
     les miniatures concernées. La liste s'affiche donc tout de suite, les fonds
     arrivent ensuite — plutôt que de faire attendre toute la bibliothèque. */
  function chargerFonds(cartes) {
    if (!KJ.session || !KJ.session.donneeImageMJ) return;
    const refs = [...new Set(cartes.map(refFond).filter(Boolean))].filter(r => !(r in fonds));
    if (!refs.length) return;
    refs.forEach(function (ref) {
      KJ.session.donneeImageMJ(ref.slice(4)).then(function (data) {
        if (!data) return;
        fonds[ref] = data;
        cartes.filter(c => refFond(c) === ref).forEach(function (c) {
          const img = document.querySelector('.fiche[data-carte="' + c.id + '"] .apercu-img');
          if (img) img.innerHTML = apercu(c);
        });
      }).catch(function () {});
    });
  }

  /* Une carte = un fichier cartes/<id>.json. Pas de copie, pas de version « fournie »
     à côté d'une version « à moi » : ce qui est listé ici est ce qui sera commité. */
  function fiche(carte) {
    const d = document.createElement('div'); d.className = 'fiche';
    d.dataset.carte = carte.id;          // permet de redessiner sa miniature quand le fond arrive
    const nb = carte.elements.length;
    const dim = carte.grille.cell
      ? `${(carte.taille.w / carte.grille.cell * carte.grille.metres).toFixed(0)} × ${(carte.taille.h / carte.grille.cell * carte.grille.metres).toFixed(0)} m`
      : `${carte.taille.w} × ${carte.taille.h} px`;
    const maj = carte.maj ? new Date(carte.maj).toLocaleDateString('fr-FR') : '';
    d.innerHTML = `<div class="apercu-img">${apercu(carte)}</div>`
      + `<div class="txt"><b>${R.esc(carte.nom)}</b><div>${dim} · ${nb} élément${nb > 1 ? 's' : ''}${maj ? ' · ' + maj : ''}</div></div>`;
    /* TOUTE la fiche ouvre la carte. Elle affichait « cursor:pointer » — donc elle
       promettait d'être cliquable — sans aucun gestionnaire : seuls les petits boutons
       naviguaient. Au doigt, on touche la vignette ou le nom, et rien ne se passait.
       La rangée d'actions est exclue, sinon chaque bouton déclencherait aussi ceci. */
    const ouvrir = () => { location.href = 'editeur.html?id=' + encodeURIComponent(carte.id); };
    d.addEventListener('click', (e) => { if (!e.target.closest('.actions')) ouvrir(); });

    const act = document.createElement('div'); act.className = 'actions';
    const lien = document.createElement('button');
    lien.textContent = modifiable ? 'Ouvrir' : 'Voir';
    lien.title = modifiable ? 'Ouvrir dans l’éditeur' : 'Ouvrir (lecture seule sur cet appareil)';
    lien.addEventListener('click', ouvrir);
    act.appendChild(lien);
    const jouer = document.createElement('button');
    jouer.textContent = '▶ Jouer';
    jouer.title = 'Ouvrir en mode Jeu (brouillard, jetons)';
    jouer.addEventListener('click', () => location.href = 'table.html?carte=' + encodeURIComponent(carte.id));
    act.appendChild(jouer);
    const svg = document.createElement('button');
    svg.textContent = '↓ SVG';
    // vue joueurs : l'export de la bibliothèque livrait la vue MJ — secrets,
    // zones cachées et natures compris. Pour un export MJ, passer par l'éditeur.
    svg.addEventListener('click', async () => {
      // le fond est une référence de compte : on va le chercher pour ne pas livrer
      // un SVG amputé de son décor
      const ref = refFond(carte);
      if (ref && !fonds[ref] && KJ.session && KJ.session.donneeImageMJ) {
        svg.disabled = true;
        try { const d = await KJ.session.donneeImageMJ(ref.slice(4)); if (d) fonds[ref] = d; }
        catch (e) { /* hors ligne : on exporte sans le fond, en le disant */ }
        svg.disabled = false;
      }
      if (ref && !fonds[ref])
        await KJ.dlg.info('Le fond d’image n’a pas pu être récupéré (compte non connecté ou '
          + 'hors ligne) : le SVG sera exporté sans son décor.', { titre: 'Fond d’image absent' });
      S.exporterSVG(carte, { vueMJ: false, grille: true, resoudreSrc: (s) => fonds[s] || '' });
    });
    act.appendChild(svg);
    if (modifiable) {
      const ren = document.createElement('button');
      ren.textContent = '✎ Renommer';
      ren.title = 'Renommer la carte ou la changer de dossier';
      ren.addEventListener('click', () => dialogueCarte(carte));
      act.appendChild(ren);
      const sup = document.createElement('button');
      sup.textContent = '✕'; sup.className = 'danger';
      sup.title = 'Supprimer le fichier de cette carte';
      sup.addEventListener('click', () => {
        KJ.dlg.confirmer('Elle sera retirée de ta bibliothèque (et du dossier lié s’il y en a un — '
          + 'tant que ce n’est pas commité, « git checkout » rétablit le fichier).',
          { titre: 'Supprimer « ' + carte.nom + ' » ?', ok: 'Supprimer', danger: true })
          .then(oui => {
            if (!oui) return;
            S.supprimerCarte(carte.id).then(charger)
              .catch(e => KJ.dlg.info('Suppression impossible : ' + (e && e.message || e), { titre: 'Impossible' }));
          });
      });
      act.appendChild(sup);
    }
    d.appendChild(act);
    d.querySelector('.apercu-img').addEventListener('click', () => lien.click());
    if (modifiable) {   // glisser une fiche sur un titre de dossier pour l'y ranger
      d.draggable = true;
      d.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', carte.id);
        e.dataTransfer.effectAllowed = 'move';
        d.classList.add('en-vol');
      });
      d.addEventListener('dragend', function () { d.classList.remove('en-vol'); });
    }
    return d;
  }

  /* Plus de diagnostic « doublons / identifiants à rétablir » : il n'existait que
     parce que la même carte pouvait vivre en deux exemplaires (copie de travail +
     fichier du dépôt). Un fichier par carte, un identifiant par fichier : il n'y a
     plus rien à réparer. */

  function alerte(html) {
    const a = $('alerte-fichier');
    a.className = 'alerte'; a.innerHTML = html;
    return a;
  }

  /* Filtre de campagne, mémorisé d'une visite à l'autre. */
  let filtre = '*';
  try { filtre = localStorage.getItem('kj-filtre-campagne') || '*'; } catch (e) {}
  let campLocales = [];      // toutes les cartes affichées
  let modifiable = false;    // dossier lié = on peut écrire les fichiers
  /* Le filtre ne doit proposer que des campagnes réellement affichées : une campagne
     qui ne vient que de cartes fournies masquées (car j'en ai une copie) n'existe plus
     à l'écran, la proposer donnerait un filtre vide. */
  function trierCampagnes(a, b) {
    if (a === M.SANS_CAMPAGNE) return 1;
    if (b === M.SANS_CAMPAGNE) return -1;
    return a.localeCompare(b, 'fr', { sensitivity: 'base' });
  }

  function majFiltre(visibles) {
    const noms = M.listeCampagnes(visibles || campLocales);
    (S.campagnesDeclarees ? S.campagnesDeclarees() : []).forEach(function (d) { if (noms.indexOf(d) < 0) noms.push(d); });
    noms.sort(trierCampagnes);
    // garde-fou : un filtre pointant sur une campagne disparue (renommée, vidée,
    // ou masquée) donnerait une bibliothèque vide sans raison visible.
    if (filtre !== '*' && noms.indexOf(filtre) < 0) {
      filtre = '*';
      try { localStorage.setItem('kj-filtre-campagne', filtre); } catch (e) {}
    }
    const sel = $('filtre-campagne');
    if (noms.length < 2) { sel.style.display = 'none'; return; }   // inutile s'il n'y en a qu'une
    sel.style.display = '';
    sel.innerHTML = '<option value="*">Toutes les campagnes</option>'
      + noms.map(n => '<option value="' + n.replace(/"/g, '&quot;') + '">' + n + '</option>').join('');
    sel.value = filtre;
    /* Une carte neuve hérite de la campagne AFFICHÉE : sans ça, créée « sans
       campagne » alors qu'un filtre est actif, elle n'apparaissait nulle part au
       retour dans la bibliothèque — impression de travail perdu. */
    const bn = $('b-nouveau');
    if (bn) bn.href = 'editeur.html?id=nouveau'
      + (filtre !== '*' && filtre !== M.SANS_CAMPAGNE ? '&campagne=' + encodeURIComponent(filtre) : '');
  }
  $('filtre-campagne').addEventListener('change', (e) => {
    filtre = e.target.value;
    try { localStorage.setItem('kj-filtre-campagne', filtre); } catch (err) {}
    charger();
  });


  /* ---------- boîte de dialogue ---------- */
  function ouvrirModale(titre, construire, valider) {
    const m = $('modale'), corps = $('modale-corps');
    $('modale-titre').textContent = titre;
    $('modale-ok').textContent = 'Enregistrer';   // libellé par défaut, un dialogue peut le changer
    // réactiver : une tentative de connexion précédente a pu le laisser désactivé
    $('modale-ok').disabled = false;
    corps.innerHTML = '';
    const ctx = construire(corps);
    m.hidden = false;
    const premier = corps.querySelector('input');
    if (premier) { premier.focus(); premier.select(); }
    const fermer = () => { m.hidden = true; document.removeEventListener('keydown', touche); };
    const ok = () => { const r = valider(ctx); if (r !== false) { fermer(); } };
    function touche(e) {
      if (e.key === 'Escape') fermer();
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') ok();
    }
    document.addEventListener('keydown', touche);
    $('modale-ok').onclick = ok;
    $('modale-annuler').onclick = fermer;
    m.onclick = (e) => { if (e.target === m) fermer(); };
  }
  function champInput(parent, label, valeur, liste) {
    const d = document.createElement('div'); d.className = 'champ';
    const l = document.createElement('label'); l.textContent = label;
    const i = document.createElement('input'); i.type = 'text'; i.value = valeur || '';
    if (liste) {
      i.setAttribute('list', liste.id);
      if (!$(liste.id)) {
        const dl = document.createElement('datalist'); dl.id = liste.id;
        dl.innerHTML = liste.valeurs.map(v => '<option value="' + v.replace(/"/g, '&quot;') + '">').join('');
        document.body.appendChild(dl);
      } else {
        $(liste.id).innerHTML = liste.valeurs.map(v => '<option value="' + v.replace(/"/g, '&quot;') + '">').join('');
      }
    }
    d.appendChild(l); d.appendChild(i); parent.appendChild(d);
    return i;
  }
  function noteModale(parent, html) {
    const p = document.createElement('p'); p.className = 'aide'; p.innerHTML = html;
    parent.appendChild(p);
  }

  /* ---------- renommer / ranger une carte ---------- */
  function dialogueCarte(carte) {
    const campagnes = M.listeCampagnes(campLocales)
      .filter(x => x !== M.SANS_CAMPAGNE);
    ouvrirModale('Renommer et ranger', (corps) => {
      const nom = champInput(corps, 'Nom', carte.nom);
      const camp = champInput(corps, 'Campagne', carte.campagne || '',
        { id: 'dl-campagnes', valeurs: campagnes });
      camp.placeholder = M.SANS_CAMPAGNE;
      noteModale(corps, 'La campagne sert de dossier. Saisis un nom inédit pour créer un '
        + 'nouveau dossier, ou laisse vide pour « ' + M.SANS_CAMPAGNE + ' ».');
      return { nom, camp };
    }, (ctx) => {
      const nom = ctx.nom.value.trim();
      if (!nom) { KJ.dlg.info('Le nom ne peut pas être vide.'); return false; }
      S.chargerCarte(carte.id).then(c => {
        if (!c) return;
        c.nom = nom;
        c.campagne = ctx.camp.value.trim();
        return S.enregistrerCarte(c).then(charger);
      }).catch(e => KJ.dlg.info('Enregistrement impossible : ' + (e && e.message || e), { titre: 'Impossible' }));
    });
  }

  /* ---------- renommer un dossier (toutes ses cartes suivent) ---------- */
  function dialogueCampagne(ancien, cartes) {
    ouvrirModale('Renommer le dossier', (corps) => {
      const nom = champInput(corps, 'Campagne', ancien === M.SANS_CAMPAGNE ? '' : ancien);
      nom.placeholder = M.SANS_CAMPAGNE;
      noteModale(corps, 'Les <b>' + cartes.length + '</b> carte(s) de ce dossier seront déplacées. '
        + 'Laisser vide les range dans « ' + M.SANS_CAMPAGNE + ' ».');
      return { nom };
    }, (ctx) => {
      const nouveau = ctx.nom.value.trim();
      if (nouveau === (ancien === M.SANS_CAMPAGNE ? '' : ancien)) return;   // rien à faire
      let p = Promise.resolve();
      for (const carte of cartes)
        p = p.then(() => S.chargerCarte(carte.id).then(c => {
          if (!c) return;
          c.campagne = nouveau;
          return S.enregistrerCarte(c);
        }));
      p.then(() => {
        S.renommerCampagneDeclaree(ancien, nouveau);
        // le filtre pointait peut-être sur l'ancien nom
        if (filtre === ancien) {
          filtre = nouveau || M.SANS_CAMPAGNE;
          try { localStorage.setItem('kj-filtre-campagne', filtre); } catch (e) {}
        }
        charger();
      });
    });
  }

  /* Déplace une carte dans une campagne (glisser-déposer ou dialogue). */
  function rangerCarte(id, campagne) {
    return S.chargerCarte(id).then(function (c) {
      if (!c) return;
      c.campagne = (campagne === M.SANS_CAMPAGNE) ? "" : campagne;
      return S.enregistrerCarte(c).then(charger);
    }).catch(e => KJ.dlg.info('Déplacement impossible : ' + (e && e.message || e), { titre: 'Impossible' }));
  }

  /* Rendu groupé par campagne : chaque campagne est un « dossier ». */
  function afficherGroupe(conteneur, cartes) {
    conteneur.innerHTML = '';
    const groupes = M.parCampagne(cartes);
    let noms = M.listeCampagnes(cartes);
    // un dossier déclaré s'affiche même vide : il doit pouvoir recevoir des cartes
    if (modifiable) {
      (S.campagnesDeclarees ? S.campagnesDeclarees() : []).forEach(function (d) { if (noms.indexOf(d) < 0) noms.push(d); });
      noms.sort(trierCampagnes);
    }
    noms = noms.filter(n => filtre === '*' || n === filtre);
    if (!noms.length) {
      const p = document.createElement('p');
      p.className = 'vide';
      p.style.cssText = 'grid-column:1/-1;padding:0 18px';
      p.textContent = 'Aucune carte dans cette campagne. ';
      const b = document.createElement('button');
      b.textContent = 'Afficher toutes les campagnes';
      b.addEventListener('click', function () {
        filtre = '*';
        try { localStorage.setItem('kj-filtre-campagne', filtre); } catch (e) {}
        charger();
      });
      p.appendChild(b);
      conteneur.appendChild(p);
      return;
    }
    for (const nom of noms) {
      const lot = groupes[nom] || [];
      const t = document.createElement('h3');
      t.className = 'titre-campagne';
      t.innerHTML = '<span>' + R.esc(nom) + '</span><em>'
        + (lot.length ? lot.length + ' carte' + (lot.length > 1 ? 's' : '') : 'dossier vide')
        + '</em><span class="esp-c"></span>';
      if (modifiable) {
        // zone de dépôt : faire glisser une fiche sur ce titre pour l'y ranger
        t.addEventListener('dragover', function (e) { e.preventDefault(); t.classList.add('survol'); });
        t.addEventListener('dragleave', function () { t.classList.remove('survol'); });
        t.addEventListener('drop', function (e) {
          e.preventDefault(); t.classList.remove('survol');
          const id = e.dataTransfer.getData('text/plain');
          if (id) rangerCarte(id, nom);
        });
        const b = document.createElement('button');
        b.textContent = '✎ Renommer';
        b.title = 'Renommer ce dossier (ses cartes suivent)';
        const lotFige = lot.slice();
        b.addEventListener('click', function () { dialogueCampagne(nom, lotFige); });
        t.appendChild(b);
        if (!lot.length && nom !== M.SANS_CAMPAGNE) {
          const x = document.createElement('button');
          x.textContent = '✕'; x.className = 'danger';
          x.title = 'Supprimer ce dossier vide';
          x.addEventListener('click', function () { S.oublierCampagne(nom); charger(); });
          t.appendChild(x);
        }
      }
      conteneur.appendChild(t);
      if (!lot.length) {
        const v = document.createElement('p');
        v.className = 'vide depot-vide';
        v.textContent = 'Dossier vide — fais glisser une carte sur son titre pour l’y ranger.';
        conteneur.appendChild(v);
      }
      for (const carte of lot) conteneur.appendChild(fiche(carte));
    }
  }

  /* Écran de panne : une page vide ne dit rien à personne. Dès que le chargement
     échoue ou n'aboutit pas, on affiche la cause et des sorties de secours. */
  let rendu = false;
  function ecranPanne(titre, detail) {
    if (rendu) return;
    const c = $('liste');
    c.innerHTML = '';
    const p = document.createElement('div');
    p.className = 'alerte';
    p.style.cssText = 'grid-column:1/-1;margin:12px 18px;border-radius:8px;border:1px solid var(--sang)';
    p.innerHTML = '<b>' + titre + '</b><br>' + (detail || '')
      + '<br><br>Essaie dans cet ordre :';
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:7px;flex-wrap:wrap;margin-top:10px';
    function bouton(txt, fn) {
      const b = document.createElement('button');
      b.textContent = txt;
      b.addEventListener('click', fn);
      actions.appendChild(b);
    }
    /* Le cache est LA cause la plus fréquente : un ancien HTML ou script servi
       depuis le cache donne une page cassée qu'aucune correction n'atteint.
       On le propose donc en premier, avec un vidage complet. */
    bouton('🧹 Vider le cache et recharger', function () {
      const taches = [];
      if (window.caches && caches.keys)
        taches.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }).catch(function () {}));
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
        taches.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {}));
      Promise.all(taches).then(function () { location.reload(true); });
    });
    bouton('↻ Réessayer', function () { location.reload(); });
    bouton('⛓ Délier le dossier', function () {
      Promise.resolve(S.oublierDossierDepot ? S.oublierDossierDepot() : null)
        .catch(function () {})
        .then(function () { location.reload(); });
    });
    bouton('⌫ Réinitialiser les réglages', function () {
      try {
        localStorage.removeItem('kj-filtre-campagne');
        localStorage.removeItem('kj-campagnes');
      } catch (e) {}
      location.reload();
    });
    p.appendChild(actions);
    c.appendChild(p);
  }

  function charger() {
    /* Chien de garde : si rien n'est rendu au bout de 9 s (permission de dossier
       jamais accordée, stockage muet…), on le dit au lieu de laisser un écran noir. */
    setTimeout(function () {
      ecranPanne('Le chargement n’aboutit pas.',   // 16 s : le premier démarrage charge le SDK
        'Deux causes, par ordre de fréquence :<br>'
        + '<b>1. Le cache du navigateur</b> sert une ancienne version de l’application — '
        + 'commence par vider le cache ci-dessous, ou fais <b>Ctrl+Maj+R</b>.<br>'
        + '<b>2. Un dossier lié devenu inaccessible</b> (déplacé, renommé, autorisation '
        + 'expirée) : délie-le, puis relie-le depuis l’éditeur avec 💾 Enregistrer.');
    }, 16000);

    /* Qui est là ? Trois publics : le MJ connecté (bibliothèque en ligne), le MJ sur
       SON PC (dossier lié), et tout le monde d'autre — qui ne voit RIEN d'autre que
       la porte d'entrée. La connexion s'établit EN PREMIER : c'est elle qui charge le
       SDK — le faire pendant la liste faisait expirer les délais au premier démarrage
       (bibliothèque à tort vide, à froid). */
    const pConnecte = (KJ.session && KJ.session.configuree() && KJ.session.mjProbable())
      ? S.avecDelai(KJ.session.quiEstConnecte().catch(() => null), 12000, null)
      : Promise.resolve(null);   // sans marqueur MJ : porte d'entrée immédiate, pas de SDK
    return pConnecte.then(connecte => Promise.all([
      connecte,
      S.avecDelai(S.listerCartes(), 12000, []),
      S.avecDelai(S.peutModifier(), 6000, false),   // ne jamais rester suspendu ici non plus
    ])).then(async ([connecte, cartes, editable]) => {
      /* « connecte » suffit : un compte MJ connecté peut toujours enregistrer et
         supprimer ses cartes en ligne (voir stockage.enregistrerCarte). peutModifier()
         refait pourtant la même vérification réseau, derrière un délai de 6 s — sur un
         téléphone en réseau faible, ce délai expirait et faisait basculer un MJ pourtant
         connecté en LECTURE SEULE : plus de « Nouvelle carte », et « Voir » au lieu
         d'« Ouvrir ». On ne dépend donc plus de cette seconde réponse. */
      modifiable = editable || !!connecte;
      majBoutonMJ(connecte);
      if (!modifiable && !connecte) { rendu = true; return porteEntree(); }
      campLocales = cartes;
      $('grp-edition').hidden = !modifiable;
      const note = $('note-lecture');
      note.hidden = modifiable;
      if (!modifiable) {
        if (S.depotPrisEnCharge()) {
          note.innerHTML = '<b>Lecture seule.</b> Ce navigateur n’est pas encore relié à ton '
            + 'dossier <code>plateforme</code> — ';
          const lier = document.createElement('button');
          lier.textContent = '🔗 Lier le dossier';
          lier.addEventListener('click', function () {
            // le sélecteur de dossier n'est permis que depuis un clic (contrainte navigateur)
            S.lierDossierDepot().then(function () { rendu = false; charger(); })
              .catch(function (e) {
                if (e && e.name === 'AbortError') return;   // choix annulé
                KJ.dlg.info('Liaison impossible : ' + (e && e.message || e)
                  + '\nChoisis le dossier « plateforme » (celui qui contient cartes/ et images/).',
                  { titre: 'Dossier non lié' });
              });
          });
          note.appendChild(lier);
        } else {
          note.innerHTML = '<b>Lecture seule sur cet appareil.</b> Les cartes se modifient sur PC '
            + '(Chrome, Edge ou Brave) ; ici, elles se consultent et se jouent.';
        }
      }
      majFiltre(cartes);
      const c = $('liste');
      if (!cartes.length) {
        c.innerHTML = '<p class="vide" style="grid-column:1/-1;padding:0 18px">'
          + 'Ta bibliothèque est vide. Crée une carte (＋ Nouvelle carte), ou importe tes '
          + 'fichiers .json d’un coup (↑ Importer — plusieurs fichiers à la fois) : ils '
          + 'seront enregistrés dans ton compte et disponibles sur tous tes appareils.</p>';
      } else { afficherGroupe(c, cartes); chargerFonds(cartes); }
      rendu = true;                    // succès constaté, pas seulement espéré
    }).catch(function (err) {
      ecranPanne('Le chargement a échoué.',
        'Commence par vider le cache (bouton ci-dessous) ou <b>Ctrl+Maj+R</b> : c’est la cause '
        + 'la plus fréquente.<br>Détail technique : <code>'
        + ((err && err.message) || err) + '</code>');
    });
  }

  /* ---------- installer l'application ----------
     Le manifeste, les icônes et le service worker existaient déjà : l'application
     était installable, mais uniquement par le menu du navigateur — que personne ne va
     chercher. Ce bouton déclenche la vraie invite quand le navigateur la propose, et
     explique le geste sur iOS, qui ne la propose jamais. */
  (function installation() {
    const b = $('b-installer');
    if (!b) return;
    // déjà installée : on tourne dans la fenêtre autonome, le bouton n'a plus d'objet
    const installee = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone === true;
    if (installee) return;
    /* iOS/iPadOS n'émet jamais beforeinstallprompt : sans ce cas particulier, les
       utilisateurs d'iPhone n'auraient simplement aucun bouton. */
    const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (window.__kjInvite || iOS) b.hidden = false;
    // l'écouteur de <head> a pu se déclencher avant que le bouton existe
    window.addEventListener('beforeinstallprompt', function () { b.hidden = false; });
    window.addEventListener('appinstalled', function () {
      window.__kjInvite = null;
      b.hidden = true;
      KJ.dlg.info('Cartographie est installée : tu la retrouveras avec tes autres '
        + 'applications, et elle s’ouvrira sans barre d’adresse.', { titre: 'Installée' });
    });
    b.addEventListener('click', function () {
      const invite = window.__kjInvite;
      if (invite) {
        invite.prompt();
        // l'invite ne se rejoue pas : une fois consommée, on l'oublie
        Promise.resolve(invite.userChoice).then(function (r) {
          window.__kjInvite = null;
          if (r && r.outcome === 'accepted') b.hidden = true;
        }).catch(function () { window.__kjInvite = null; });
        return;
      }
      if (iOS) {
        KJ.dlg.info('Sur iPhone et iPad, l’installation passe par Safari :\n\n'
          + '1. Touche le bouton Partager (le carré avec une flèche vers le haut).\n'
          + '2. Choisis « Sur l’écran d’accueil ».\n'
          + '3. Valide avec « Ajouter ».', { titre: 'Installer sur iOS' });
        return;
      }
      KJ.dlg.info('Ton navigateur ne propose pas l’installation pour l’instant. '
        + 'Sur PC (Chrome, Edge, Brave), cherche l’icône d’installation dans la barre '
        + 'd’adresse, ou « Installer Cartographie » dans le menu ⋮.',
        { titre: 'Installation' });
    });
  })();

  $('b-campagne').addEventListener('click', function () {
    const connues = M.listeCampagnes(campLocales)
      .filter(x => x !== M.SANS_CAMPAGNE).concat((S.campagnesDeclarees ? S.campagnesDeclarees() : []));
    ouvrirModale('Nouvelle campagne', function (corps) {
      const nom = champInput(corps, 'Nom', '');
      nom.placeholder = 'Les Cendres de Nox';
      noteModale(corps, 'Le dossier apparaîtra vide dans ta bibliothèque. Fais ensuite glisser '
        + 'des cartes sur son titre pour les y ranger.');
      return { nom: nom, connues: connues };
    }, function (ctx) {
      const nom = ctx.nom.value.trim();
      if (!nom) { KJ.dlg.info('Donne un nom à la campagne.'); return false; }
      if (ctx.connues.indexOf(nom) >= 0) { KJ.dlg.info('Cette campagne existe déjà.'); return false; }
      S.declarerCampagne(nom);
      filtre = '*';
      try { localStorage.setItem('kj-filtre-campagne', filtre); } catch (e) {}
      charger();
    });
  });

  /* ---------- porte d'entrée et compte MJ ----------
     Sans dossier lié ni compte, la bibliothèque n'existe pas à l'écran : un joueur
     entre avec un code, un MJ se connecte. */
  function porteEntree() {
    $('grp-edition').hidden = true;
    $('note-lecture').hidden = true;
    $('filtre-campagne').style.display = 'none';
    $('lien-table').style.display = 'none';
    const c = $('liste');
    c.innerHTML = '';
    const d = document.createElement('div');
    d.style.cssText = 'grid-column:1/-1;display:flex;flex-direction:column;align-items:center;'
      + 'gap:16px;padding:56px 18px;text-align:center';
    const p = document.createElement('p');
    p.className = 'aide';
    p.style.cssText = 'margin:0;max-width:52ch';
    p.innerHTML = '<b>Bienvenue à la table.</b><br>Joueur : entre le code donné par ton MJ. '
      + 'Maître de jeu : connecte-toi pour retrouver tes cartes et tes parties.';
    d.appendChild(p);
    const b1 = document.createElement('button');
    b1.textContent = '📡 Rejoindre une partie';
    b1.style.cssText = 'font-size:15px;padding:12px 22px;min-height:46px';
    b1.addEventListener('click', demanderCode);
    d.appendChild(b1);
    const b2 = document.createElement('button');
    b2.textContent = '🛡 Espace MJ — connexion';
    b2.style.cssText = 'font-size:13px;padding:9px 18px';
    b2.addEventListener('click', dialogueConnexion);
    d.appendChild(b2);
    c.appendChild(d);
  }
  function demanderCode() {
    // saisie interne (voir js/dialogue.js) : prompt() est illisible sur téléphone
    // et supprimable par le navigateur
    KJ.dlg.saisir('Ton MJ te l’a donné — quatre chiffres.', '',
      { titre: 'Rejoindre une partie', max: 8, placeholder: '4827' }).then(saisi => {
      const code = String(saisi || '').replace(/\D+/g, '');
      if (code) location.href = 'table.html?session=' + encodeURIComponent(code);
      else if (saisi !== null) KJ.dlg.info('Un code de partie ne contient que des chiffres.');
    });
  }
  function majBoutonMJ(email) {
    const b = $('b-mj');
    b.textContent = email ? '🛡 ' + email : '🛡 Espace MJ';
    b.classList.toggle('actif', !!email);
    b.onclick = email
      ? function () {
          KJ.dlg.confirmer('Connecté en tant que ' + email + '.',
            { titre: 'Se déconnecter ?', ok: 'Se déconnecter', danger: true })
            .then(function (oui) { if (oui) KJ.session.deconnexion().then(function () { location.reload(); }); });
        }
      : dialogueConnexion;
  }
  function dialogueConnexion() {
    if (!KJ.session || !KJ.session.configuree()) { KJ.dlg.info('Configuration Firebase absente.', { titre: 'Espace MJ indisponible' }); return; }
    /* Une session peut déjà exister sur cette adresse sans que la page le sache
       (le marqueur local est propre à chaque origine : 127.0.0.1 et le site publié
       sont deux mondes séparés pour le navigateur). On vérifie avant de demander
       des identifiants pour rien, et on recharge une fois si c'est le cas. */
    var relance = false;
    try { relance = sessionStorage.getItem('kj-relance-mj') === '1'; } catch (e) {}
    if (!KJ.session.mjProbable() && !relance) {
      KJ.session.quiEstConnecte().then(function (email) {
        if (!email) { dialogueIdentifiants(); return; }
        try { sessionStorage.setItem('kj-relance-mj', '1'); } catch (e) {}
        KJ.dlg.info('Compte ' + email + ' déjà connecté sur cette adresse — la page va se recharger '
          + 'pour retrouver tes cartes et tes images.', { titre: 'Espace MJ' })
          .then(function () { location.reload(); });
      }).catch(function () { dialogueIdentifiants(); });
      return;
    }
    dialogueIdentifiants();
  }
  function dialogueIdentifiants() {
    ouvrirModale('Espace MJ', function (corps) {
      noteModale(corps, 'Ton compte garde tes cartes et tes parties privées. '
        + 'Les joueurs n’en ont pas besoin : un code de partie leur suffit.');
      const em = champInput(corps, 'E-mail', '');
      em.type = 'email';
      const mp = champInput(corps, 'Mot de passe', '');
      mp.type = 'password';
      const err = document.createElement('p');
      err.className = 'aide'; err.style.color = 'var(--sang)';
      corps.appendChild(err);
      /* Tentative avec RETOUR VISIBLE : l'ancienne version ne montrait rien pendant
         l'attente (chargement du SDK compris, parfois long) — la connexion pouvait
         réussir sans que la page ne réagisse, obligeant à rafraîchir. */
      function tenter(fn) {
        const ok = $('modale-ok');
        if (ok.disabled) return;   // une tentative est déjà en cours
        err.style.color = 'var(--encre)'; err.textContent = 'Connexion…';
        ok.disabled = true; bc.disabled = true;
        const lent = setTimeout(function () {
          err.textContent = 'Toujours en cours (réseau lent ?)… ça peut encore aboutir.';
        }, 8000);
        fn(em.value, mp.value)
          .then(function () {
            clearTimeout(lent);
            $('modale-annuler').click();
            // si le rechargement de la bibliothèque échoue, on recharge la page
            // plutôt que de laisser un écran connecté-mais-pas-à-jour
            Promise.resolve().then(charger).catch(function () { location.reload(); });
          })
          .catch(function (e) {
            clearTimeout(lent);
            ok.disabled = false; bc.disabled = false;
            err.style.color = 'var(--sang)';
            err.textContent = (e && e.message) || 'Connexion impossible.';
          });
      }
      const pc = document.createElement('p'); pc.className = 'aide';
      const bc = document.createElement('button');
      bc.textContent = 'Première fois ? Créer un compte MJ';
      bc.addEventListener('click', function () { tenter(KJ.session.creerCompteMJ); });
      pc.appendChild(bc); corps.appendChild(pc);
      $('modale-ok').textContent = 'Se connecter';
      return { tenter: tenter };
    }, function (ctx) {
      ctx.tenter(KJ.session.connexionMJ);
      return false;   // fermeture uniquement en cas de succès (asynchrone)
    });
  }
  $('b-rejoindre').addEventListener('click', demanderCode);

  $('b-importer').addEventListener('click', () => $('fichier').click());
  /* Import en lot : sélectionner d'un coup tous ses fichiers de cartes — c'est aussi
     le chemin de migration vers la bibliothèque en ligne depuis n'importe quel
     navigateur (Firefox compris, qui ne sait pas lier de dossier). */
  $('fichier').addEventListener('change', (e) => {
    const fichiers = [...e.target.files];
    if (!fichiers.length) return;
    e.target.value = '';
    let p = Promise.resolve(0);
    for (const f of fichiers)
      p = p.then(n => S.importerFichier(f).then(c => S.enregistrerCarte(c)).then(() => n + 1)
        .catch(err => { KJ.dlg.info('« ' + f.name + ' » : import impossible — ' + err.message,
          { titre: 'Import' }); return n; }));
    p.then(n => {
      if (fichiers.length === 1 && n === 1) return charger();
      KJ.dlg.info(n + ' carte' + (n > 1 ? 's' : '') + ' importée' + (n > 1 ? 's' : '')
        + ' sur ' + fichiers.length + '.', { titre: 'Import terminé' });
      charger();
    });
  });

  if (location.protocol === 'file:') {
    document.getElementById('alerte-fichier').className = 'alerte';
    document.getElementById('alerte-fichier').innerHTML =
      '<b>Ouvre la plateforme par le lanceur.</b> En accès direct au fichier, le navigateur '
      + 'refuse de charger les cartes de la campagne et le stockage local peut être bridé. '
      + 'Double-clique sur <code>Lancer la plateforme.bat</code>, puis va sur '
      + '<code>http://127.0.0.1:8777/</code>.';
  }
  charger();
  KJ.stockage.gererServiceWorker();
})();
</script>
