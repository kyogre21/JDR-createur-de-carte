<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Table de jeu — Cartographe</title>
<link rel="stylesheet" href="css/commun.css">
<link rel="icon" href="icone-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#221b11">
<style>
  /* ---------- table de jeu ---------- */
  #scene{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;background:#0a0806;cursor:grab}
  #scene.o-reveal,#scene.o-hide{cursor:crosshair}
  #scene.o-mesure{cursor:cell}
  /* will-change : promeut le monde sur son propre calque GPU — le pan/zoom ne
     repeint plus le SVG ni le canvas de brouillard, il ne fait que composer */
  #monde{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #monde > *{position:absolute;left:0;top:0}
  #plan{display:block}
  /* côté MJ, le voile reste transparent pour travailler ; côté joueurs il est opaque */
  #fog{pointer-events:none;opacity:.58}
  body[data-vue="joueurs"] #fog{opacity:1}
  body[data-vue="joueurs"] .mj-only{display:none !important}
  /* les deux barres s'excluent : ne jamais mettre de display en style inline,
     il gagnerait contre ces règles */
  #barre-mj{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  #barre-joueurs{display:flex;gap:6px}
  /* En préview locale (un seul écran, montré directement aux joueurs — typiquement un MJ
     solo sur portable, sans second écran), les outils de plan doivent rester utilisables :
     déplacer/recadrer, révéler/cacher le brouillard, tout couvrir/révéler, mesurer, #b-vue
     pour repasser en vue MJ, et #b-galerie pour montrer une illustration (« il y a
     quelqu'un ici ») — c'est justement l'écran qu'on montre aux joueurs, le bon moment
     pour la déclencher. Le reste (jetons, édition, bibliothèque) reste des outils de
     préparation, sans rapport avec ce qui se montre à l'écran, donc masqué. Le geste de
     pinceau et le clic sur une icône d'image ne vérifient que la vraie fenêtre joueurs
     (`?vue=joueurs`, la variable `vueJoueurs`), jamais cette préview locale : rien à
     changer côté interactions, seuls les boutons étaient cachés en trop. */
  body[data-vue="joueurs"] #barre-mj > *:not([data-o]):not(#b-annuler-fog):not(#b-couvrir):not(#b-decouvrir):not(#b-cadrer):not(#b-vue):not(#b-galerie):not(#b-jeton){display:none}
  /* la vraie fenêtre séparée n'a droit à AUCUN outil MJ, contrairement à la préview locale
     ci-dessus : elle doit rester un pur miroir. Plus spécifique que la règle du dessus
     (deux sélecteurs dont un id, contre un id + une classe d'attribut) : l'emporte pour
     #barre-mj lui-même, et un parent display:none masque tous ses enfants quel que soit
     leur propre display — inutile de refaire la liste d'exceptions à l'envers. */
  body.fenetre-joueurs #barre-mj{display:none}
  body[data-vue="mj"] #barre-joueurs{display:none}

  #pins{pointer-events:none;width:100%;height:100%}
  .pin{position:absolute;width:0;height:0;pointer-events:auto;cursor:pointer}
  .pin .los{position:absolute;left:-9px;top:-9px;width:18px;height:18px;background:var(--or);
    transform:rotate(45deg);border:2px solid #0d0a07;box-shadow:0 0 10px rgba(201,162,39,.5)}
  .pin.inerte .los{background:#5a5348;box-shadow:none}
  .pin .lab{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(13,10,7,.85);
    color:var(--or);padding:1px 7px;border-radius:3px;font:600 11px var(--ui);white-space:nowrap}
  .pin.inerte .lab{color:#8d8474}
  body[data-vue="joueurs"] .pin{cursor:default}
  /* portail marqué « caché aux joueurs » : estompé côté MJ, absent côté joueurs
     (préview locale comprise) tant qu'il n'est pas révélé */
  .pin.zone-cachee{opacity:.45}
  body[data-vue="joueurs"] .pin.zone-cachee{display:none}
  /* fenêtre projetée : rien n'y est manipulable */
  body[data-vue="joueurs"] #choix-carte{pointer-events:none;opacity:.75}

  /* icônes d'illustration (créatures, lieux) : réservées au MJ tant que non révélées
     (clic droit dessus — voir basculerRevele) : leur seule présence trahirait « il y a
     quelque chose ici ». Un clic (gauche) ouvre la lightbox — c'est le mécanisme pour
     révéler « il y a quelqu'un ici » au bon moment. Une fois révélée, l'icône reste
     visible en permanence, y compris dans une vraie fenêtre séparée (?vue=joueurs) —
     c'est le sens même de « rendre visible aux joueurs ». Cette fenêtre séparée reste en
     revanche un simple miroir, jamais cliquable : c'est le MJ qui déclenche, depuis son
     propre écran (classe .fenetre-joueurs, posée une fois pour toutes par table.js). */
  #images{pointer-events:none;width:100%;height:100%}
  .img-pin{position:absolute;width:0;height:0;pointer-events:auto;cursor:pointer}
  .img-pin .ic{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:6px;
    background:var(--salle);border:1.6px solid var(--or);display:flex;align-items:center;justify-content:center;
    font-size:14px;box-shadow:0 0 8px rgba(0,0,0,.55)}
  .img-pin.revele .ic{border-color:#7fa070}
  body[data-vue="joueurs"] .img-pin:not(.revele){opacity:0}
  /* joueurs : seules les images RÉVÉLÉES sont touchables ; le reste demeure inerte */
  body.fenetre-joueurs .img-pin:not(.revele){pointer-events:none;cursor:default}

  /* lightbox : agrandit l'image au clic, le plan reste visible en dessous */
  #lightbox{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(8,6,4,.92);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s;padding:24px}
  #lightbox.vu{opacity:1;pointer-events:auto}
  #lightbox img{max-width:min(92vw,900px);max-height:80vh;object-fit:contain;border-radius:6px;
    border:1px solid var(--bord-clair);box-shadow:0 10px 40px rgba(0,0,0,.7)}
  #lightbox .legende{color:var(--or);font:italic 15px var(--serif);text-align:center;margin:0}
  #lightbox .legende:empty{display:none}
  /* réservée à la vraie fenêtre séparée (voir plus haut) : la préview locale doit
     pouvoir l'afficher, c'est tout l'intérêt de #b-galerie et du clic sur une icône. */
  /* la lightbox est permise aux joueurs : elle ne s'ouvre que depuis une image révélée.
     La galerie complète (catalogue) reste, elle, réservée au MJ. */

  /* boîte de dialogue générique (galerie d'images, nouveau jeton…) : réutilise le modale
     de commun.css, avec une variante plus large (.large) pour une grille d'images. */
  #modale.large .boite{width:min(560px,94vw);max-height:86vh;overflow-y:auto}
  #modale .entete-modale{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #modale .entete-modale h3{margin:0}
  #modale .aide{margin:6px 0}
  /* la fenêtre joueurs n'a pas de dialogues… sauf celui explicitement autorisé
     (création de SON jeton PJ, classe posée par le bouton « ＋ Mon jeton ») */
  body.fenetre-joueurs #modale:not(.pour-joueur){display:none !important}

  #jetons{width:100%;height:100%;pointer-events:none}
  .jeton{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
    border:2.5px solid #0d0a07;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    cursor:grab;font:700 15px var(--ui);color:#100d08;background-size:cover;background-position:center;
    box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,255,255,.35);touch-action:none}
  .jeton.drag{cursor:grabbing;box-shadow:0 6px 14px rgba(0,0,0,.8);z-index:5}
  /* Zone tactile à taille constante à l'écran (voir appliquerCam / --inv).
     Sans elle, un jeton mesure ~17 px sur un plan dézoomé — impossible à attraper au
     doigt, alors que le code de déplacement, lui, fonctionne : le bug était la cible,
     pas la logique. Transparent mais bien testé au clic (comme les zones de clic des
     symboles : une surface sans remplissage visible reste cliquable). */
  .jeton::before,.pin::before,.img-pin::before{content:'';position:absolute;left:50%;top:50%;
    width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;
    transform:scale(var(--inv,1))}
  /* le halo ne doit pas passer devant l'étiquette d'un portail, qui reste lisible */
  /* seuls les jetons flottent au-dessus du brouillard ; les libellés de portail
     appartiennent au décor et doivent disparaître sous lui comme leur losange */
  .jeton{z-index:1}
  /* réservé aux jetons PJ, et seulement dans la vraie fenêtre séparée : la préview locale
     du MJ (même écran) doit rester entièrement manipulable, comme le reste des outils
     exemptés plus haut — c'est là-dessus que ce bug se voyait (un clic sur le jeton
     n'atteignait même pas le code, pointer-events:none l'empêchait). */
  body.fenetre-joueurs .jeton:not([data-pj="true"]){pointer-events:none}

  #sur{pointer-events:none;width:100%;height:100%}
  .ping{position:absolute;width:0;height:0}
  .ping span{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;
    border:2.5px solid var(--or);border-radius:50%;opacity:0;animation:ping 1.6s ease-out forwards}
  .ping span:nth-child(2){animation-delay:.25s}
  .ping span:nth-child(3){animation-delay:.5s}
  @keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(6);opacity:0}}
  #regle{overflow:visible}
  #regle line{stroke:var(--or);stroke-width:2;stroke-dasharray:6 4}
  #etiquette{position:absolute;background:#0d0a07;color:var(--or);font:600 12px var(--ui);
    padding:2px 7px;border-radius:3px;white-space:nowrap;transform:translate(10px,-24px);
    border:1px solid var(--or)}
  #badge-session{font:600 12px var(--ui);color:var(--or);background:#241d14;
    border:1px solid var(--or);border-radius:5px;padding:4px 9px;white-space:nowrap}
  /* seul élément resté en habillage natif (blanc éclatant) au milieu de la charte */
  #choix-carte{background:#241d14;border:1px solid var(--bord-clair);border-radius:5px;
    color:var(--encre);font:600 12.5px var(--ui);padding:5px 8px;max-width:38vw}
  /* chez les joueurs (session ou fenêtre séparée) : une étiquette du lieu, pas un menu —
     dérouler la liste révélerait les noms de toutes les cartes (spoilers), et changer de
     carte localement désynchroniserait la vue par rapport au MJ */
  body.fenetre-joueurs #choix-carte{pointer-events:none;-webkit-appearance:none;appearance:none;
    background:none;border:none;color:var(--or);font:italic 15px var(--serif)}
  /* le nom du jeton vit dans une pastille sous le rond : en toutes lettres dans le rond,
     il débordait en texte sombre sur fond sombre — illisible dès qu'on quittait une zone
     éclairée. Le rond ne porte plus que l'initiale (ou le portrait). */
  .jeton .lab{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:rgba(13,10,7,.85);color:var(--encre);padding:1px 6px;border-radius:3px;
    font:600 10.5px var(--ui);white-space:nowrap;pointer-events:none}
  #b-aide{min-width:32px;justify-content:center;font-family:var(--serif);font-style:italic}
  #modale .aide-jeu p{margin:4px 0;font-size:12.5px;line-height:1.5}
  #modale .aide-jeu b{color:var(--or)}

  /* Téléphone / tablette : la barre d'outils défile horizontalement au lieu de
     s'empiler sur trois lignes et de manger la carte. */
  @media (max-width:820px){
    header{flex-wrap:nowrap;gap:6px;padding:5px 6px}
    header .marque{display:none}
    #choix-carte{flex:0 1 40vw;min-width:0;font-size:12px}
    /* La scrollbar est masquée (esthétique), donc rien d'autre n'indique que la barre
       défile : un dégradé sur le bord droit sert d'indice, sinon les boutons après
       « Tout révéler » (Jeton, réinitialiser, galerie, vue joueurs, éditer…) sont
       invisibles sans qu'on sache qu'il faut glisser pour les atteindre. */
    #barre-mj{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;
      -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
      mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
    #barre-mj::-webkit-scrollbar{display:none}
    #barre-mj button, #barre-mj .btn{flex:0 0 auto;padding:5px 7px;font-size:11px;min-height:34px}
    #barre-mj .sep{flex:0 0 1px}
    #scene{min-height:0}
  }
</style>
</head>
<body data-vue="mj">

<header>
  <div class="marque">Table <span>de jeu</span></div>
  <span id="badge-session" hidden></span>
  <select id="choix-carte" title="Carte affichée"></select>
  <div class="esp"></div>
  <span id="barre-mj">
    <button data-o="deplacer" class="actif" title="Déplacer les jetons et la vue">✥</button>
    <button data-o="reveal" title="Révéler le terrain au pinceau">☀ Révéler</button>
    <button data-o="hide" title="Recouvrir de brouillard">☁ Cacher</button>
    <button data-o="mesure" title="Mesurer une distance">⟷</button>
    <button id="b-annuler-fog" title="Annuler le dernier geste de brouillard (Ctrl+Z)">↶</button>
    <span class="sep"></span>
    <button id="b-couvrir" title="Recouvrir toute la carte">Tout couvrir</button>
    <button id="b-decouvrir" title="Tout révéler">Tout révéler</button>
    <span class="sep"></span>
    <button id="b-jeton" title="Ajouter un jeton">+ Jeton</button>
    <button id="b-amener" title="Amener les jetons des PJ sur cette carte">⇄ PJ</button>
    <span class="sep"></span>
    <button id="b-reinitialiser" class="danger" title="Remettre cette carte à neuf pour une nouvelle table : brouillard, révélations et jetons de cette carte">↺ Réinitialiser cette carte</button>
    <span class="sep"></span>
    <button id="b-galerie" title="Montrer une illustration sans la poser sur le plan">🖼 Galerie</button>
    <span class="sep"></span>
    <button id="b-session" title="Tes parties : les joueurs les rejoignent depuis leur téléphone avec un code, et tout ce qui a été découvert se conserve d’une séance à l’autre">📡 Partie</button>
    <button id="b-vue" title="Prévisualiser ce que voient les joueurs (G)">Vue joueurs</button>
    <button id="b-cadrer" title="Recadrer">⤢</button>
    <button id="b-aide" title="Aide : gestes et raccourcis">?</button>
    <a class="btn" id="b-editer" href="editeur.html" title="Modifier cette carte">✎ Éditer</a>
    <a class="btn" href="index.html">☰ Cartes</a>
  </span>
  <span id="barre-joueurs">
    <button id="b-suivre" class="actif">Suivre le MJ</button>
    <button id="b-cadrer-j" title="Recadrer la carte (utile en Vue libre)">⤢</button>
    <button id="b-jeton-joueur" hidden title="Créer ton jeton de personnage (envoyé au MJ)">＋ Mon jeton</button>
    <button id="b-quitter-partie" hidden title="Quitter cette partie et revenir à l’accueil">✕ Quitter</button>
  </span>
</header>
<div id="toast"></div>

<!-- boîte de dialogue générique : galerie d'images, nouveau jeton… (voir ouvrirModale() dans table.js) -->
<div id="modale" hidden>
  <div class="boite">
    <div class="entete-modale">
      <h3 id="modale-titre"></h3>
      <button id="b-fermer-modale" title="Fermer (Échap)">✕</button>
    </div>
    <div id="modale-corps"></div>
  </div>
</div>

<div id="scene">
  <div id="monde">
    <svg id="plan"></svg>
    <!-- les portails font partie du décor : sous le brouillard, donc invisibles
         tant que la zone n'est pas révélée. Les jetons, eux, restent au-dessus. -->
    <div id="pins"></div>
    <!-- icônes d'illustration : même logique, et de toute façon masquées en vue joueurs -->
    <div id="images"></div>
    <canvas id="fog"></canvas>
    <div id="jetons"></div>
    <div id="sur"><svg id="regle"></svg></div>
  </div>
</div>

<script src="js/modele.js"></script>
<script src="js/rendu.js"></script>
<script src="js/stockage.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/table.js"></script>
</body>
</html>
