<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Éditeur — Cartographe</title>
<link rel="stylesheet" href="css/commun.css">
<link rel="icon" href="icone-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#221b11">
</head>
<body>

<header>
  <div class="marque">Cartographie</div>
  <input id="nom-carte" placeholder="Nom de la carte">
  <div class="esp"></div>
  <button id="b-enregistrer" title="Enregistrer (Ctrl+S)">💾 Enregistrer</button>
  <button id="b-undo" title="Annuler (Ctrl+Z)">↶</button>
  <button id="b-redo" title="Refaire (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button id="b-vue" class="actif" title="Basculer vue MJ / vue joueurs">Vue MJ</button>
  <button id="b-cadrer" title="Recadrer la vue">⤢</button>
  <button id="b-panneau" title="Replier / déplier le panneau">▤</button>
  <span id="grp-export">
    <span class="sep"></span>
    <button id="b-json" title="Exporter le fichier .json (à versionner dans le dépôt)">↓ JSON</button>
    <button id="b-svg" title="Exporter le SVG (pour les PDF de Codex)">↓ SVG</button>
    <button id="b-scene" title="Copier le bloc de scène (pour une page de table externe)">⧉ Scène</button>
    <span class="sep"></span>
  </span>
  <a class="btn" id="b-jouer" href="table.html" title="Ouvrir cette carte en mode Jeu (brouillard, jetons)">▶ Jouer</a>
  <a class="btn" href="index.html" title="Bibliothèque de cartes">☰ Cartes</a>
</header>
<div id="toast"></div>

<div id="app">
  <div id="outils"></div>
  <div id="canevas">
    <div id="monde">
      <svg id="plan"></svg>
      <svg id="edition"></svg>
    </div>
  </div>
  <div id="panneau">
    <h3 id="t-props">Élément</h3>
    <div id="props"></div>
    <h3>Calques</h3>
    <div id="calques"></div>
    <h3>Carte</h3>
    <div id="carte-props"></div>
    <h3>Clé numérotée</h3>
    <div id="cle"></div>
  </div>
</div>

<footer><span id="etat">Prêt.</span></footer>

<script src="js/modele.js"></script>
<script src="js/rendu.js"></script>
<script src="js/stockage.js"></script>
<!-- la bibliothèque en ligne (compte MJ) : l’éditeur enregistre dans le compte,
     le dossier lié n’est plus qu’une copie fichiers pour git -->
<script src="js/firebase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/editeur.js"></script>
</body>
</html>
